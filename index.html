<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HABIT TRACKER DAILY - Modern Bento & Glassmorphism PWA</title>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Aplikasi pelacak kebiasaan harian modern dengan Bento Glassmorphism UI, statistik mingguan, dan kalender rekap bulanan.">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HabitTracker">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">

  <!-- Desktop Sidebar Navigation -->
  <aside class="sidebar-desktop">
    <div class="sidebar-brand">
      <img src="assets/icons/favicon.svg" alt="Habit Tracker Logo" class="sidebar-brand-icon">
      <span class="sidebar-brand-text">HABIT TRACKER</span>
    </div>

    <nav class="sidebar-nav-links">
      <button class="sidebar-nav-item nav-item active" data-route="today" onclick="window.appRouter.navigate('today')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Hari Ini (Today)</span>
      </button>
      <button class="sidebar-nav-item nav-item" data-route="stats" onclick="window.appRouter.navigate('stats')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Statistik (Stats)</span>
      </button>
      <button class="sidebar-nav-item nav-item" data-route="calendar" onclick="window.appRouter.navigate('calendar')">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Kalender Bulanan</span>
      </button>
      <button class="sidebar-nav-item nav-item" data-route="settings" onclick="window.appRouter.navigate('settings')">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Pengaturan & PWA</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-subtle-sm w-full" onclick="window.appModal.openAddHabitModal()">
        ✏️ + Tambah Habit
      </button>
    </div>
  </aside>

  <!-- Main Container -->
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
    <!-- Top Header Navigation -->
    <header class="app-header">
      <!-- Top Left: App Brand Name & Icon -->
      <div class="header-brand-left" onclick="window.appRouter.navigate('today')" title="Ke Halaman Hari Ini">
        <img src="assets/icons/favicon.svg" alt="Habit Tracker Logo" class="header-brand-icon">
        <span class="header-brand-name">
          <span class="brand-short">HABIT TRACKER</span>
          <span class="brand-full">HABIT TRACKER DAILY</span>
        </span>
      </div>

      <!-- Right: Current View Title & Date Subtitle -->
      <div class="header-right-info">
        <h1 class="header-title" id="header-title-text">Today</h1>
        <span class="header-date-sub" id="header-date-sub">Memuat...</span>
      </div>
    </header>

    <!-- Main Views -->
    <main class="main-wrapper">
      <!-- 1. Today View -->
      <section id="today-view" class="view-section active">
        <!-- Rendered by js/app.js -->
      </section>

      <!-- 2. Statistics View -->
      <section id="stats-view" class="view-section">
        <!-- Rendered by js/statistics.js -->
      </section>

      <!-- 3. Calendar View -->
      <section id="calendar-view" class="view-section">
        <!-- Rendered by js/calendar.js -->
      </section>

      <!-- 4. Settings View -->
      <section id="settings-view" class="view-section">
        <!-- Rendered by js/app.js -->
      </section>
    </main>
  </div>

  <!-- Floating Action Button (+) -->
  <button id="fab-add-habit" class="fab-add" onclick="window.appModal.openAddHabitModal()" title="Tambah Habit Baru" aria-label="Tambah Habit Baru">
    +
  </button>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav-mobile" aria-label="Navigasi Bawah">
    <button class="nav-item active" data-route="today" onclick="window.appRouter.navigate('today')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Today</span>
    </button>
    <button class="nav-item" data-route="stats" onclick="window.appRouter.navigate('stats')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Stats</span>
    </button>
    <button class="nav-item" data-route="calendar" onclick="window.appRouter.navigate('calendar')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Kalender</span>
    </button>
    <button class="nav-item" data-route="settings" onclick="window.appRouter.navigate('settings')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </button>
  </nav>

  <!-- Modals -->
  <!-- 1. Add Habit & Form Modal -->
  <div id="habit-form-modal" class="modal-overlay"></div>

  <!-- 2. Individual Habit Detail & Streaks Modal -->
  <div id="habit-detail-modal" class="modal-overlay"></div>

  <!-- 3. PWA Install Guide Modal -->
  <div id="install-guide-modal" class="modal-overlay"></div>

  <!-- Scripts in dependency order -->
  <script src="js/data.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
