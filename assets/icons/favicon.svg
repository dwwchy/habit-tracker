<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="109" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

  <!-- Outer Progress Track (Subtle Translucent Ring) -->
  <circle cx="256" cy="268" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="26" />

  <!-- Animated-like Progress Track (Emerald) -->
  <circle cx="256" cy="268" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="26"
    stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="140" filter="url(#glow)" />

  <!-- Inner Soft Card Glow -->
  <circle cx="256" cy="268" r="105" fill="rgba(15, 23, 42, 0.45)" />

  <!-- Emerald Checkmark with shadow -->
  <path d="M196 268 L236 308 L318 226" fill="none" stroke="#FFFFFF" stroke-width="32"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Streak Fire Accent at Top Right -->
  <g transform="translate(330, 95) scale(1.1)" filter="url(#shadow)">
    <path d="M24 0 C28 12 36 20 40 30 C45 42 42 54 32 60 C20 67 6 62 2 50 C-2 38 4 28 12 22 C14 20 18 14 16 8 C16 4 20 1 24 0 Z" fill="url(#fireGrad)" />
    <path d="M22 28 C25 34 26 40 22 46 C19 50 13 49 11 44 C9 39 12 34 16 31 C18 29 20 26 22 28 Z" fill="#FEF08A" />
  </g>

  <!-- Small Stars / Sparkles -->
  <circle cx="120" cy="140" r="6" fill="#FCD34D" opacity="0.8" />
  <circle cx="140" cy="115" r="3" fill="#FFFFFF" opacity="0.9" />
</svg>